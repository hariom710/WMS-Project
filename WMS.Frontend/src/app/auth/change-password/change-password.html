<div class="changepw-container" role="main">
  <div class="page-header">
    <div class="page-header-left">
      <h1>Change Password</h1>
      <p>Update your account password to keep it secure</p>
    </div>
  </div>

  <div class="card animate-slideUp">
    <div class="card-body">
      <div *ngIf="message" [ngClass]="isError ? 'alert-danger' : 'alert-success'" class="alert" role="alert">
        <span>{{ isError ? '⚠️' : '✅' }}</span> {{ message }}
      </div>

      <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" aria-label="Change password form">
        <div class="form-group">
          <label class="form-label" for="current-password">Current Password</label>
          <input type="password" id="current-password" class="form-input" formControlName="oldPassword" placeholder="Enter current password" autocomplete="current-password">
          <div *ngIf="passwordForm.get('oldPassword')?.touched && passwordForm.get('oldPassword')?.invalid" class="form-error" role="alert">
            Current password is required.
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="new-password">New Password</label>
          <input type="password" id="new-password" class="form-input" formControlName="newPassword" placeholder="Enter new password (min 6 characters)" autocomplete="new-password">
          <div *ngIf="passwordForm.get('newPassword')?.touched && passwordForm.get('newPassword')?.invalid" class="form-error" role="alert">
            <span *ngIf="passwordForm.get('newPassword')?.errors?.['required']">New password is required.</span>
            <span *ngIf="passwordForm.get('newPassword')?.errors?.['minlength']">Password must be at least 6 characters.</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg changepw-submit-btn" [disabled]="passwordForm.invalid" aria-label="Update password">
          Update Password
        </button>
      </form>
    </div>
  </div>
</div>
