name: Build and deploy Angular app to Azure Web App - hariomwmsfrontend8501

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: WMS.Frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: ./WMS.Frontend

      - name: Build for production
        run: npm run build -- --configuration production
        working-directory: ./WMS.Frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: ./WMS.Frontend/dist/WMS-Frontend

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'hariomwmsfrontend8501'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: .
